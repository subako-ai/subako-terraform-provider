# Publishes the provider archives a tag names. `subako terraform` downloads
# them from this release page and verifies each against the checksum list, so
# the asset names scripts/build.sh writes are what it asks for: renaming one
# breaks the install.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go alone: terraform builds nothing here, and the suite ran in CI.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: go
      - name: Build the release archives
        run: scripts/build.sh "${GITHUB_REF_NAME#v}" target
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/terraform-provider-subako_*
