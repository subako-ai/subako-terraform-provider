# Onboarding: mise trust && mise run test

[tools]
# go.mod's `toolchain` line is Go's own pin, and Go switches to it from any
# older release, so the two name one version.
# CODESYNC(go-toolchain)
"go" = "1.27.1"
# The suite drives a real Terraform binary through terraform-plugin-testing,
# so the version here is what the write-only attribute tests run against.
"terraform" = "1.16.0"

[tasks.fmt]
description = "Format Go sources and the example configuration"
run = ["gofmt -w .", "terraform fmt -recursive examples"]

# gofmt lists what it would change and exits 0 either way, so an empty list is
# the check.
[tasks."fmt:check"]
description = "Verify formatting without writing"
run = [
  "test -z \"$(gofmt -l .)\"",
  "terraform fmt -recursive -check -diff examples",
]

[tasks.lint]
description = "Vet the module"
run = ["go vet ./..."]

[tasks.test]
description = "Run the provider suite"
run = ["go test ./..."]

# A binary in bin/ is what a `dev_overrides` block in a Terraform CLI
# configuration points at to run a local change; see the README.
[tasks.build]
description = "Build the provider into bin/"
run = ["go build -o bin/ ."]
